[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kotorblender"
version = "5.0.0"
description = "Blender extension for importing, editing, and exporting KotOR game assets"
readme = "README.md"
requires-python = ">=3.8"

# Dev environment: pip install ".[dev]"  (IDE stubs, pytest, ruff, optional pykotor)
[project.optional-dependencies]
dev = [
    "pykotor>=2.3.1",
    "fake-bpy-module-3.6>=20260128",
    "fake-bpy-module-4.0>=20260128",
    "fake-bpy-module-4.1>=20260128",
    "fake-bpy-module-4.2>=20260128",
    "fake-bpy-module-4.4>=20260128",
    "fake-bpy-module-5.0>=20260128",
    "fake-bpy-module-5.1>=20260128",
    "pytest>=9.0.2",
    "ruff>=0.9.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["io_scene_kotor*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pyright]
pythonVersion = "3.11"
reportMissingModuleSource = false
reportWildcardImportFromLibrary = false

# Only test/unit is discoverable by pytest (VS Code Test Adapter).
# test/blender/ requires Blender — use make test / test/run_blender_tests.py
[tool.pytest.ini_options]
testpaths = ["test/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
