name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_DIR: ${{ github.workspace }}/.blender

jobs:
  # ── Fast checks – no Blender needed ──────────────────────────────────────
  lint:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: Syntax check (py_compile)
        run: python3 helper_scripts/check_syntax.py

      - name: Lint (fatal errors only – E9, F821, F823)
        # Star-import warnings (F401/F403) are pre-existing and excluded.
        run: ruff check --select E9,F821,F823 io_scene_kotor/

      - name: Unit tests (no Blender)
        run: python -m pytest test/unit -v

  # ── Blender background-mode tests + extension build ──────────────────────
  test-and-build:
    name: Test & Build (Blender ${{ matrix.blender_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender_version:
          - "3.6.13"  # 3.6 LTS (minimum supported)
          - "4.2.13"  # 4.2 LTS
          - "5.0.1"   # First 5.x release
          - "5.1.0"   # Latest stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bundle PyKotor wheels (extension + symlinked tests)
        run: |
          python helper_scripts/makefile_fs.py clean-whl io_scene_kotor/wheels
          python -m pip install -U pip
          python -m pip wheel "pykotor==2.3.1" -w io_scene_kotor/wheels
          python helper_scripts/sync_extension_wheels.py

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ matrix.blender_version }}-linux-x64-v1

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          MAJOR_MINOR=$(echo "${{ matrix.blender_version }}" | cut -d. -f1-2)
          URL="https://download.blender.org/release/Blender${MAJOR_MINOR}/blender-${{ matrix.blender_version }}-linux-x64.tar.xz"
          echo "Downloading: $URL"
          wget -q "$URL" -O /tmp/blender.tar.xz
          mkdir -p "${{ env.BLENDER_DIR }}"
          tar -xf /tmp/blender.tar.xz --strip-components=1 -C "${{ env.BLENDER_DIR }}"

      - name: Verify Blender
        run: |
          echo "Blender version: ${{ env.BLENDER_DIR }}/blender --version"
          "${{ env.BLENDER_DIR }}/blender" --version

      - name: Set up addon/extension
        run: |
          MAJOR_MINOR=$(echo "${{ matrix.blender_version }}" | cut -d. -f1-2)
          # Blender 3.6 uses scripts/addons; 4.2+ uses extensions/user_default
          if [[ "$(printf '%s\n' "4.2" "$MAJOR_MINOR" | sort -V | head -n1)" == "4.2" ]]; then
            ADDON_DIR=~/.config/blender/${MAJOR_MINOR}/extensions/user_default
          else
            ADDON_DIR=~/.config/blender/${MAJOR_MINOR}/scripts/addons
          fi
          mkdir -p "$ADDON_DIR"
          ln -sf "$GITHUB_WORKSPACE/io_scene_kotor" "$ADDON_DIR/io_scene_kotor"
          echo "Addon installed at: $ADDON_DIR/io_scene_kotor"

      - name: Run tests
        run: |
          echo "Running tests with Blender: ${{ env.BLENDER_DIR }}/blender"
          python test/run_blender_tests.py --blender "${{ env.BLENDER_DIR }}/blender"

      - name: Build extension package
        if: matrix.blender_version != '3.6.13'
        run: |
          # Wheels already fetched for tests; avoid second PyPI hit
          SKIP_WHEEL_DOWNLOAD=1 BLENDER="${{ env.BLENDER_DIR }}/blender" make build

      - name: Upload extension artifact
        if: matrix.blender_version != '3.6.13' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kotorblender-${{ matrix.blender_version }}-${{ github.sha }}
          path: build/*.zip
          retention-days: 30
