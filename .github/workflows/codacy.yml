name: Codacy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  codacy-analysis:
    name: Codacy Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          # Upload results to Codacy when CODACY_PROJECT_TOKEN is configured.
          # This resolves the Codacy App "action_required" check on the PR.
          # Without the token the analysis still runs and prints to the log.
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: true
          # Never fail the workflow on issue count – quality gates are
          # enforced by the Codacy App PR status check, not this step.
          max-allowed-issues: 2147483647
