name: Codacy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codacy-analysis:
    name: Codacy Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          output: results.sarif
          format: sarif
          # Compatibility flag: avoids SARIF fingerprint conflicts with CodeQL
          gh-code-scanning-compat: true
          # Never block the workflow; quality gates are enforced by Codacy's
          # own PR status check, not by making this step exit non-zero.
          max-allowed-issues: 2147483647

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
